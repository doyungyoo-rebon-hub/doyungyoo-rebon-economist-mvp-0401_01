# ====================================================================
# Nginx 사내망 / 온프레미스 역방향 프록시 (Reverse Proxy) 표준 설정
# ====================================================================

upstream ai_report_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.internal 192.168.1.100; # 사내 도메인 또는 서버 IP

    # 대용량 리포트 원문 및 PDF 업로드/스트리밍 대응 (100MB)
    client_max_body_size 100M;

    # Gzip 압축 설정
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 프록시 헤더 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SSE(Server-Sent Events) 및 실시간 스트리밍 버퍼링 해제
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;

    location / {
        proxy_pass http://ai_report_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # 정적 에셋 장기 캐싱 (선택 사항)
    location /assets/ {
        proxy_pass http://ai_report_upstream;
        proxy_http_version 1.1;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
